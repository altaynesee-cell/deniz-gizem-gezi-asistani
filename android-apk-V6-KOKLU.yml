name: Deniz Gizem Gezi Asistani V6 KOKLU APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repo dosyalarini al
        uses: actions/checkout@v4
      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.7 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: V6 projeyi ac
        run: |
          rm -rf project
          mkdir project
          unzip -q deniz_gizem_gezi_asistani_V6_KOKLU.zip -d project
          test -f project/app/src/main/java/com/altay/denizgizem/MainActivity.java
          test -f project/app/src/main/java/com/altay/denizgizem/CuratedData.java
          test -f project/app/src/main/java/com/altay/denizgizem/StrictRules.java
      - name: APK derle
        working-directory: project
        run: gradle --no-daemon :app:assembleDebug
      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: DenizGizem-Gezi-Asistani-V6-KOKLU-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
