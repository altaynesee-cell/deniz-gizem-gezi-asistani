name: Deniz Gizem Gezi Asistani TEMIZ V1 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Dosyalari al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Projeyi ac
        run: |
          rm -rf project
          mkdir project
          unzip -q deniz_gizem_gezi_asistani_TEMIZ_V1.zip -d project

      - name: Android ve Kotlin ayarlarini duzelt
        run: |
          cat > project/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > project/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.altay.denizgizem"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.altay.denizgizem"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

      - name: APK derle
        working-directory: project
        run: gradle --no-daemon :app:assembleDebug

      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: DenizGizem-Gezi-Asistani-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
