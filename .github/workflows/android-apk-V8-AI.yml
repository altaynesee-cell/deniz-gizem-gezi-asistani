name: Deniz Gizem Gezi Asistani V8 AI APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: |
          rm -rf project
          mkdir project
          unzip -q deniz_gizem_gezi_asistani_V8_AI.zip -d project
          test -f project/android/app/src/main/java/com/altay/denizgizem/MainActivity.java
          test -f project/server/index.mjs
      - working-directory: project/android
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DenizGizem-Gezi-Asistani-V8-AI-APK
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
