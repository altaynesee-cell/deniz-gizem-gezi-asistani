name: Deniz Gizem Gezi Asistani V12 HIZLI TURKIYE APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android 36 platformunu kur
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: V12 projeyi ac
        run: |
          rm -rf project
          mkdir project
          unzip -q deniz_gizem_gezi_asistani_V12_HIZLI_TURKIYE.zip -d project
          test -f project/gradle.properties
          grep -q "android.useAndroidX=true" project/gradle.properties
          test -f project/app/src/main/java/com/altay/denizgizem/LiveOsmClient.kt
          grep -q "quickSearch" project/app/src/main/java/com/altay/denizgizem/LiveOsmClient.kt
          grep -q "isMeaningfulName" project/app/src/main/java/com/altay/denizgizem/Core.kt
      - name: Kritik testleri calistir
        working-directory: project
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: APK derle
        working-directory: project
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DenizGizem-V12-HIZLI-TURKIYE-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
