name: Deniz Gizem V13 OFFLINE TURKIYE APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Repo dosyalarini al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Android 36 platformunu kur
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Gradle 8.13 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: V13 ZIP dosyasini bul ve ac
        run: |
          rm -rf project
          mkdir project
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname 'deniz_gizem_gezi_asistani_V13_OFFLINE_TURKIYE*.zip' | sort | tail -n 1)"
          echo "Bulunan ZIP: $ZIP_FILE"
          test -n "$ZIP_FILE"
          unzip -q "$ZIP_FILE" -d project
          test -f project/data/build_turkey_db.py
          test -f project/app/src/main/java/com/altay/denizgizem/OfflineDb.kt

      - name: Python 3 kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Tam Turkiye veri cache
        id: data-cache
        uses: actions/cache@v4
        with:
          path: project/app/src/main/assets/turkey_poi.sqlite
          key: denizgizem-v13-overture-2026-07-22-osm-turkey-2026-08

      - name: Veri araclarini kur
        if: steps.data-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool
          python -m pip install --upgrade pip
          pip install -r project/data/requirements.txt

      - name: OpenStreetMap Turkiye verisini indir
        if: steps.data-cache.outputs.cache-hit != 'true'
        run: |
          curl --fail --location --retry 4 \
            --output /tmp/turkey-latest.osm.pbf \
            https://download.geofabrik.de/europe/turkey-latest.osm.pbf
          test "$(stat -c%s /tmp/turkey-latest.osm.pbf)" -gt 50000000

      - name: V13 tam Turkiye veritabanini olustur
        if: steps.data-cache.outputs.cache-hit != 'true'
        run: |
          rm -f project/app/src/main/assets/turkey_poi.sqlite
          python project/data/build_turkey_db.py \
            --osm-pbf /tmp/turkey-latest.osm.pbf \
            --output project/app/src/main/assets/turkey_poi.sqlite \
            --wikipedia

      - name: Veri kalitesini zorunlu test et
        run: |
          python project/data/verify_db.py \
            project/app/src/main/assets/turkey_poi.sqlite \
            --strict
          ls -lh project/app/src/main/assets/turkey_poi.sqlite

      - name: Android unit testleri
        working-directory: project
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: APK derle
        working-directory: project
        run: gradle --no-daemon :app:assembleDebug

      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: DenizGizem-V13-OFFLINE-TURKIYE-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
