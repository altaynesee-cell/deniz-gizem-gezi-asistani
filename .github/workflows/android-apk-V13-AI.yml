name: Deniz Gizem Gezi Asistani V13 AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AI_PROXY_URL: ${{ vars.AI_PROXY_URL }}
    steps:
      - name: Repo dosyalarini al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Android 36 platformunu kur
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Gradle 8.13 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: V13 projeyi ac
        run: |
          rm -rf project
          mkdir project
          ZIP_FILE="$(find . -maxdepth 1 -type f \( -iname '*V13*AI*.zip' -o -iname '*v13*ai*.zip' \) | sort | head -n 1)"
          echo "Bulunan ZIP: $ZIP_FILE"
          test -n "$ZIP_FILE"
          unzip -q "$ZIP_FILE" -d project
          test -f project/app/src/main/java/com/altay/denizgizem/AiReviewClient.kt
          grep -Fq 'versionName = "13.0-ai-korumali"' project/app/build.gradle.kts

      - name: Kritik testleri calistir
        working-directory: project
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: APK derle
        working-directory: project
        run: gradle --no-daemon :app:assembleDebug

      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: DenizGizem-V13-AI-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
