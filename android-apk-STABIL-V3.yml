name: Deniz Gizem Gezi Asistani STABIL V3 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Dosyalari al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.7 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: V3 projeyi ac
        run: |
          rm -rf project
          mkdir project
          unzip -q deniz_gizem_gezi_asistani_STABIL_V3.zip -d project
          test -f project/settings.gradle.kts
          test -f project/app/build.gradle.kts
          test -f project/app/src/main/AndroidManifest.xml
          test -f project/app/src/main/java/com/altay/denizgizem/MainActivity.kt

      - name: APK derle
        working-directory: project
        run: gradle --no-daemon :app:assembleDebug

      - name: APK artifact yukle
        uses: actions/upload-artifact@v4
        with:
          name: DenizGizem-Gezi-Asistani-STABIL-V3-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
